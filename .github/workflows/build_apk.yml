name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Project Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opamp-virtual-lab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Op-Amp Virtual Lab Mobile App (v1.0.0)"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## 📱 Virtual Laboratory: Operational Amplifier Simulator (Android Mobile APK)

            ### Direct APK Download Link:
            👉 **[Download app-release.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk)**

            ### Features included in this release:
            - **Interactive Realistic Workbench:** Drag & drop IC 741, resistors (R1, Rf), power supply, DC source, voltmeter, and terminal pin wiring.
            - **Inverting & Non-Inverting Modes:** Automatic gain verification, phase analysis, and ±13.5V saturation clamping.
            - **Dual-Trace Oscilloscope & Transfer Plotter:** Animated real-time waveform visualization.
            - **PostgreSQL Backend Integration:** Observation tables, student profiles, circuit validation, and quiz submissions.
            - **Formal Engineering Lab Report Generator:** Ready for instant print/PDF export.

            ### Installation Instructions:
            1. Download the `app-release.apk` file on your Android device.
            2. Open the downloaded file and tap **Install** (allow *Install Unknown Apps* if prompted).
            3. Launch **Op-Amp Virtual Lab** and start your experiment!
