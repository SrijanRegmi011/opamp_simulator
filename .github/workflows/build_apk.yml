name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Check Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Run Project Unit Tests
        run: flutter test

      - name: Build Android Release APK (Universal & Split ABI)
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/OpAmp-VirtualLab-Universal.apk
          flutter build apk --split-per-abi --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/OpAmp-VirtualLab-ARM64.apk
          cp build/app/outputs/flutter-apk/OpAmp-VirtualLab-Universal.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opamp-virtual-lab-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.1
          name: "Op-Amp Virtual Lab Mobile App (v1.0.1)"
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/OpAmp-VirtualLab-Universal.apk
            build/app/outputs/flutter-apk/OpAmp-VirtualLab-ARM64.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          body: |
            ## 📱 Virtual Laboratory: Operational Amplifier Simulator (Android Mobile APK v1.0.1)

            ### Direct APK Download Links:
            1. 👉 **[OpAmp-VirtualLab-ARM64.apk (Recommended for 99% of Android phones)](https://github.com/${{ github.repository }}/releases/download/v1.0.1/OpAmp-VirtualLab-ARM64.apk)** *(Faster, lightweight, optimized for 64-bit phones)*
            2. 👉 **[OpAmp-VirtualLab-Universal.apk (Universal Compatibility)](https://github.com/${{ github.repository }}/releases/download/v1.0.1/OpAmp-VirtualLab-Universal.apk)** *(Works on all Android devices)*
            3. 👉 **[app-release.apk (Standard Release)](https://github.com/${{ github.repository }}/releases/download/v1.0.1/app-release.apk)**

            ---

            ### 🛠️ Important Installation Instructions (If it doesn't open):
            1. **Do not open directly from browser download tray**:
               - Mobile browsers (Chrome/MIUI Browser) often cannot open APKs directly and say *"Can't open file"*.
               - Instead, open your phone's **Files** or **File Manager** app -> go to **Downloads** folder -> tap the APK file.
            2. **Allow Installation from Unknown Sources**:
               - When prompted *"For security, your phone is not allowed to install unknown apps"*, tap **Settings** and toggle **Allow from this source** to ON.
            3. **Google Play Protect prompt**:
               - If Play Protect warns "Unrecognized app", tap **"More details"** -> **"Install anyway"**.
            4. **Clean Install**:
               - If you previously had an older test build installed, uninstall it first before installing v1.0.1.

            ---

            ### Features:
            - **Interactive IC 741 Workbench**: Realistic pinout, resistors, DC input, ±15V dual supply, and live multimeter.
            - **Inverting & Non-Inverting Op-Amp Modes**: Precise mathematical modeling with saturation clamping (±13.5V).
            - **Live Oscilloscope**: Sine wave input & output plotting with real-time phase inversion check.
            - **PostgreSQL Backend Ready**: Auto-syncs student verification and test readings.
