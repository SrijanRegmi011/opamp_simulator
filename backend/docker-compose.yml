version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Alpine Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: opamp_vlab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opamp_vlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opamp_vlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. pgAdmin 4 Web UI for Database Management (http://localhost:5050)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opamp_vlab_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vlab.edu
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
